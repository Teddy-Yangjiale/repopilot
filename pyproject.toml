[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.6.0"
description = "Evidence-driven repository maintenance agent scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.8,<1.0",
]
# llm extra is dependency-free: the DeepSeek adapter speaks the OpenAI-compatible
# protocol with the standard library only. The group exists so `pip install -e ".[llm]"`
# still marks LLM support as opted-in.
llm = []

[project.scripts]
repopilot = "repopilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
