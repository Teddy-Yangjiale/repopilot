name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,symbols]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Package smoke test
        run: |
          python -m build --wheel
          python -m venv /tmp/repopilot-smoke
          /tmp/repopilot-smoke/bin/pip install dist/*.whl
          /tmp/repopilot-smoke/bin/repopilot --version
